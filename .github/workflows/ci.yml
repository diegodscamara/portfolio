name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bun run e2e

      # Desktop preset: shared runners make mobile scores too noisy to gate on; mobile is checked with PageSpeed Insights.
      - name: Lighthouse CI (100 on a11y/best practices/SEO, perf >= 98, JS <= 200 KB)
        run: bunx @lhci/cli@0.15 autorun

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
