name: CI

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

# Independent jobs run in parallel; wall time is the slowest one (Lighthouse), not the sum.
jobs:
  checks:
    name: Type-check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build: true
      - name: End-to-end tests
        run: bun run e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # One runner per locale: runs in parallel and keeps scores from sharing a machine.
  # Desktop preset: shared runners make mobile scores too noisy to gate on; mobile is checked with PageSpeed Insights.
  lighthouse:
    name: Lighthouse /${{ matrix.locale }} (100 on a11y/best practices/SEO, perf >= 98, JS <= 200 KB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        locale: [en, pt]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build: true
      - name: Lighthouse CI
        run: bun run lighthouse --collect.url=http://localhost:3000/${{ matrix.locale }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.locale }}
          path: .lighthouseci/
          include-hidden-files: true # otherwise the dot-directory is silently skipped
          retention-days: 7
