name: Setup
description: Install Bun and dependencies; optionally run the production build with a warm Next.js cache.

inputs:
  build:
    description: Also run `bun run build`, restoring and saving .next/cache.
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash

    # Turbopack's persistent cache makes a warm build about 3x faster. Falls back to the closest older entry on a miss.
    - if: inputs.build == 'true'
      uses: actions/cache@v6
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', '*.config.*', 'tsconfig.json') }}
        restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
    - if: inputs.build == 'true'
      run: bun run build
      shell: bash
