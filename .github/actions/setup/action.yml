name: Setup
description: Install Bun and dependencies; optionally run the production build with a warm Astro cache.

inputs:
  build:
    description: Also run `bun run build`, restoring and saving Astro's cache (optimized images, downloaded fonts).
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash

    # Astro keeps resized images and downloaded fonts here; a warm cache skips re-encoding. Falls back to the closest older entry on a miss.
    - if: inputs.build == 'true'
      uses: actions/cache@v6
      with:
        path: node_modules/.astro
        key: astro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'astro.config.mjs', 'tsconfig.json') }}
        restore-keys: astro-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
    - if: inputs.build == 'true'
      run: bun run build
      shell: bash
